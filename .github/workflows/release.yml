name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run tests
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\RunTests.ps1

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $items = @(".\IpSwitcher.exe", ".\README.md")
          if (Test-Path .\LICENSE) { $items += ".\LICENSE" }
          Compress-Archive -Path $items -DestinationPath ".\win11-ip-switcher-$tag-x64.zip" -Force

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            IpSwitcher.exe
            win11-ip-switcher-${{ github.ref_name }}-x64.zip
